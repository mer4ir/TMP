name: CI

on:
  pull_request:
  push:
    branches: [lab1]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make fullcheck
      - run: make test
        env:
          MPLBACKEND: Agg