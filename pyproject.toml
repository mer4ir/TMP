[tool.ruff]
line-length = 88
target-version = "py311"   # поставьте свою версию Python
src = ["lab1"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
    "ANN", "D", "PL", "RUF", "T20",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях
    "T201",                        # print() здесь часть задания
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["lab1"]
exclude = ["**/.venv", "**/__pycache__"]
pythonVersion = "3.12.3"
typeCheckingMode = "strict"
reportUnknownMemberType = "none" 
executionEnvironments = [{ root = "lab1" }]

[tool.pytest.ini_options]
pythonpath = ["lab1"]
testpaths = ["lab1"]